org: ${env:SERVERLESS_ORG}
app: ${env:SERVERLESS_APP}
service: ${env:SERVERLESS_SERVICE}

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION}
  iam:
    role: ${env:AWS_ROLE}
  httpApi:
    cors: true

functions:
  # Public (no auth)
  signupUser:
    handler: controllers/user/userController.signupUser
    events:
      - httpApi:
          path: /signup
          method: post

  loginUser:
    handler: controllers/user/userController.loginUser
    events:
      - httpApi:
          path: /login
          method: post

  fetchUser:
    handler: controllers/user/userController.fetchUser
    events:
      - httpApi:
          path: /user/fetch
          method: post

  # Protected (verify JWT manually)
  editUser:
    handler: controllers/user/userController.editUser
    events:
      - httpApi:
          path: /user/edit
          method: put

  createDemand:
    handler: controllers/demand/demandController.createDemand
    events:
      - httpApi:
          path: /demand
          method: post

  fetchMyDemands:
    handler: controllers/demand/demandController.fetchMyDemands
    events:
      - httpApi:
          path: /demand
          method: get

  fetchAllDemands:
    handler: controllers/demand/demandController.fetchAllDemands
    events:
      - httpApi:
          path: /demands/all
          method: get

  fetchDemandsByIds:
    handler: controllers/demand/demandController.fetchDemandsByIds
    events:
      - httpApi:
          path: /demand/ids
          method: get

  updateDemandMatches:
    handler: controllers/demand/demandController.updateDemandMatches
    events:
      - httpApi:
          path: /demand/matches/{demandId}
          method: put

  deleteDemand:
    handler: controllers/demand/demandController.deleteDemand
    events:
      - httpApi:
          path: /demand/{demandId}
          method: delete

  getAcceptedDemands: 
    handler: controllers/demand/demandController.getAcceptedDemands
    events:
      - httpApi:
          path: /demand/accepted
          method: get

  markMatchAsSeen: # 🆕 NYTT
    handler: controllers/demand/demandController.markMatchAsSeen
    events:
      - httpApi:
          path: /demand/mark-match-as-seen
          method: post

resources:
  Resources:
    users:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:DB_TABLE_USERS}
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    demands:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:DB_TABLE_DEMANDS}
        AttributeDefinitions:
          - AttributeName: demandId
            AttributeType: S
          - AttributeName: author
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
          - AttributeName: category
            AttributeType: S
        KeySchema:
          - AttributeName: demandId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          - IndexName: author-index
            KeySchema:
              - AttributeName: author
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: createdAt-index
            KeySchema:
              - AttributeName: createdAt
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: category-index
            KeySchema:
              - AttributeName: category
                KeyType: HASH
            Projection:
              ProjectionType: ALL
